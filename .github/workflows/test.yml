name: test

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=inglenook --cov-report=term-missing
      - name: Lint
        run: ruff check src tests
