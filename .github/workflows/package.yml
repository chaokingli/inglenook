name: package

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto

permissions:
  contents: write
  packages: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=inglenook --cov-report=term-missing
      - name: Lint
        run: ruff check src tests scripts

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide bump
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump || 'auto' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "bump=none" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "bump=${INPUT_BUMP}" >> "$GITHUB_OUTPUT"
          else
            echo "bump=auto" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$COMMIT_MESSAGE" > /tmp/commit-message.txt

      - name: Bump version
        id: version
        run: |
          set -euo pipefail
          current="$(python scripts/bump_version.py --print-only)"
          bump="${{ steps.decide.outputs.bump }}"
          if [ "$bump" = "none" ]; then
            echo "version=${current}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new="$(python scripts/bump_version.py --part "$bump" --message "$(cat /tmp/commit-message.txt)")"
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/inglenook/__init__.py
          git commit -m "chore(release): v${new}"
          git tag "v${new}"
          git push origin "HEAD:${GITHUB_REF_NAME}" --tags

      - name: Build Python artifacts
        run: |
          pip install --upgrade build
          python -m build

      - name: Publish GitHub Release
        if: steps.version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  docker:
    needs: [test, release]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Refresh bumped files
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve llama-swap release
        id: llama_swap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh api repos/mostlygeek/llama-swap/releases/latest --jq .tag_name)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }},enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ github.event_name != 'schedule' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LLAMA_SWAP_VERSION=${{ steps.llama_swap.outputs.tag }}
            INGLENOOK_VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
