# VRAM gate registry for RTX 5070 Ti (16303 MiB).
# Local systemd talks to the existing llama.cpp router and ComfyUI.
# Do not spawn a second llama-server; :8198 already owns GGUF weights.

gpu:
  total_mb: 16303
  idle_used_mb: 2500
  unknown_used_warn_mb: 4096

policy:
  exclusive_group: gpu-exclusive
  occupancy: weights
  unload_timeout_s: 180
  poll_interval_ms: 500
  chat_waits_for_comfy: true
  generation_waits_for_chat_inflight: true
  generation_preempts_idle_chat: true
  stop_unknown: false

backends:
  qwen35-chat:
    need_mb: 14500
    headroom_mb: 400
    role: chat
    group: gpu-exclusive
    unload_kind: llama-unload
    busy_probe: none
    base_url: http://127.0.0.1:8198
    priority: 50
    catch_all: true
  qwen35-voice:
    need_mb: 8000
    headroom_mb: 400
    role: chat
    group: gpu-exclusive
    unload_kind: llama-unload
    busy_probe: none
    base_url: http://127.0.0.1:8198
    priority: 40
    coexist_with:
      - tts-heavy
  ls_comfyui:
    need_mb: 14000
    headroom_mb: 400
    role: comfy
    group: gpu-exclusive
    persistent: true
    unload_kind: comfy-free
    busy_probe: comfy-queue
    base_url: http://127.0.0.1:8188
    priority: 80
  tts-heavy:
    need_mb: 4000
    headroom_mb: 500
    role: tts
    group: gpu-exclusive
    unload_kind: command
    unload_command:
      - ${HOME}/dev/voice-engine/scripts/stop.sh
    busy_probe: none
    base_url: http://127.0.0.1:8210
    priority: 10
    coexist_with:
      - qwen35-voice
  whisper-cpu:
    need_mb: 0
    headroom_mb: 0
    role: stt
    group: always-cpu
    persistent: true
    unload_kind: none
    priority: 0
