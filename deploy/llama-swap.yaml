# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap on this GPU machine proxies the existing llama.cpp router
# and ComfyUI. It must not start another llama-server (that would fight :8198).
#
# Chat/audio: OpenWebUI / SillyTavern → http://<GPU-LAN-IP>:9292/v1
# Image/video: those frontends → http://<GPU-LAN-IP>:9293 (split proxy, not /v1)

healthCheckTimeout: 180
logLevel: info
startPort: 5801
sendLoadingState: true
includeAliasesInList: true
# Do not TTL-unload the llama.cpp router; exclusive swap to Comfy is the only unload path.
globalTTL: 0
unloadTimeout: 180

macros:
  inglenook_home: "${env.HOME}/dev/inglenook"
  swap_start: "${inglenook_home}/deploy/scripts/swap-start.sh"
  swap_stop: "${inglenook_home}/deploy/scripts/swap-stop.sh"

upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'
    - ^\/ws$|^\/api\/jobs$

models:
  qwen35-voice:
    name: "Qwen3.6-35B-A3B voice (cpu-moe)"
    proxy: http://127.0.0.1:8198
    aliases:
      - qwen35-chat
      - qwen35-novel
      - qwen35-code
      - qwen35-q8-chat
      - qwen35-q8-novel
      - qwen35-q8-code
    cmd: ${swap_start} qwen35-voice
    cmdStop: ${swap_stop} qwen35-voice
    ttl: 0
    timeouts:
      responseHeader: 120
    capabilities:
      in: [text, image]
      out: [text]

  # llama-swap v250 /comfyui/ looks up the model id comfyui_auto.
  comfyui_auto:
    unlisted: true
    aliases:
      - comfyui
      - ls_comfyui
    proxy: http://127.0.0.1:8188
    checkEndpoint: /system_stats
    ttl: 0
    unloadTimeout: 900
    compat:
      ignoreWebsockets: true
    timeouts:
      connect: 30
      keepalive: 0
      responseHeader: 900
      idleConn: 900
    cmd: ${swap_start} ls_comfyui
    cmdStop: ${swap_stop} ls_comfyui

  tts-heavy:
    name: "voice-engine IndexTTS-2.5"
    proxy: http://127.0.0.1:8210
    aliases:
      - indextts2
      - index-tts2
      - index-tts-2
      - tts
    checkEndpoint: /health
    ttl: 0
    timeouts:
      connect: 30
      responseHeader: 180
    cmd: ${swap_start} tts-heavy
    cmdStop: ${swap_stop} tts-heavy
    capabilities:
      in: [text]
      out: [audio]

routing:
  router:
    use: group
    settings:
      groups:
        # Chat + TTS stay up together. exclusive:true only unloads *other*
        # groups (Comfy), not members of this group.
        voice-stack:
          swap: false
          exclusive: true
          members:
            - qwen35-voice
            - tts-heavy
        # Requesting Comfy unloads the whole voice-stack (chat and TTS).
        gpu-exclusive:
          swap: true
          exclusive: true
          members:
            - comfyui_auto
