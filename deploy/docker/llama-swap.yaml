# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Docker / NAS llama-swap config.
# Chat/audio: OpenWebUI → http://<NAS-IP>:9292/v1
# Image/video: OpenWebUI / SillyTavern → http://<NAS-IP>:9293
#
# llama.cpp and ComfyUI stay on the GPU server. Point compose at them:
#   LLAMA_CPP_URL=http://gpu.lan:8198
#   COMFYUI_URL=http://gpu.lan:8188

healthCheckTimeout: 180
logLevel: info
startPort: 5801
sendLoadingState: true
globalTTL: 600
unloadTimeout: 180

upstream:
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'
    - ^\/ws$|^\/api\/jobs$

models:
  qwen35-voice:
    name: "Qwen3.6-35B-A3B voice (cpu-moe)"
    proxy: "${env.LLAMA_CPP_URL}"
    aliases:
      - qwen35-chat
      - qwen35-novel
      - qwen35-code
    cmd: /etc/inglenook/scripts/swap-start.sh qwen35-voice
    cmdStop: /etc/inglenook/scripts/swap-stop.sh qwen35-voice
    ttl: 600
    timeouts:
      responseHeader: 120
    capabilities:
      in: [text, image]
      out: [text]

  comfyui_auto:
    unlisted: true
    aliases:
      - comfyui
      - ls_comfyui
    proxy: "${env.COMFYUI_URL}"
    checkEndpoint: /system_stats
    ttl: 0
    unloadTimeout: 900
    compat:
      ignoreWebsockets: true
    timeouts:
      connect: 30
      keepalive: 0
      responseHeader: 900
      idleConn: 900
    cmd: /etc/inglenook/scripts/swap-start.sh ls_comfyui
    cmdStop: /etc/inglenook/scripts/swap-stop.sh ls_comfyui

  tts-heavy:
    name: "voice-engine TTS"
    proxy: "${env.VOICE_ENGINE_URL}"
    aliases:
      - indextts2
      - index-tts2
      - index-tts-2
      - tts
    checkEndpoint: /health
    ttl: 0
    timeouts:
      connect: 30
      responseHeader: 180
    cmd: /etc/inglenook/scripts/swap-start.sh tts-heavy
    cmdStop: /etc/inglenook/scripts/swap-stop.sh tts-heavy
    capabilities:
      in: [text]
      out: [audio]

routing:
  router:
    use: group
    settings:
      groups:
        voice-stack:
          swap: false
          exclusive: true
          members:
            - qwen35-voice
            - tts-heavy
        gpu-exclusive:
          swap: true
          exclusive: true
          members:
            - comfyui_auto
