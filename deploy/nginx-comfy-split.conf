# Include this file from an http { } block (map cannot live in server {}).
# Split reverse proxy on :9293
# POST /prompt|/upload/image|/interrupt → llama-swap /comfyui/ (triggers swap)
# everything else, including GET /prompt and /ws → local ComfyUI :8188
#
# ST Connect hits GET /system_stats + /object_info and must NOT unload chat.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream llama_swap {
    server 127.0.0.1:9292;
}

upstream comfy_local {
    server 127.0.0.1:8188;
}

server {
    listen 9293;
    listen [::]:9293;
    server_name _;

    client_max_body_size 64m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;

    error_page 418 = @comfy_swap;

    location = /prompt {
        if ($request_method = POST) { return 418; }
        proxy_pass http://comfy_local;
    }

    location = /api/prompt {
        if ($request_method = POST) { return 418; }
        proxy_pass http://comfy_local;
    }

    location = /upload/image {
        if ($request_method = POST) { return 418; }
        proxy_pass http://comfy_local;
    }

    location = /api/upload/image {
        if ($request_method = POST) { return 418; }
        proxy_pass http://comfy_local;
    }

    location = /interrupt {
        if ($request_method = POST) { return 418; }
        proxy_pass http://comfy_local;
    }

    location = /api/interrupt {
        if ($request_method = POST) { return 418; }
        proxy_pass http://comfy_local;
    }

    location @comfy_swap {
        proxy_pass http://llama_swap/comfyui$request_uri;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://comfy_local;
    }
}
