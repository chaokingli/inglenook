[*]
offline = 1
flash-attn = on
cache-prompt = 1
jinja = 1

[qwen38-chat]
model = /models/qwen38-27b-q4_k.gguf
mmproj = /models/mmproj-model-bf16.gguf
n-gpu-layers = auto
batch-size = 2048
ubatch-size = 512
cache-type-k = q8_0
cache-type-v = q8_0
ctx-size = 65536
n-predict = -1
temp = 0.45
top-k = 40
top-p = 0.9
reasoning = off

[qwen38-code]
model = /models/qwen38-27b-q4_k.gguf
mmproj = /models/mmproj-model-bf16.gguf
n-gpu-layers = auto
ctx-size = 131072
n-predict = -1
temp = 1.0
reasoning = on
