[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inglenook"
version = "0.1.0"
description = "Thin VRAM gate on top of llama-swap for 16GB local chat, image, and video."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "chaokingli" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
nvml = ["nvidia-ml-py>=12.535"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
inglenook = "inglenook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "-q",
]
markers = [
    "unit: fast tests with no hardware",
    "integration: tests that start local sockets",
]

[tool.coverage.run]
source = ["inglenook"]
branch = true
omit = ["src/inglenook/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["inglenook"]
